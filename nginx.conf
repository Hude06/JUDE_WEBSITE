server {
    listen 80;
    server_name clientsite.com;

    # Pageview tracking endpoint. Public by necessity (anonymous browsers beacon
    # here), so it cannot be token-protected — rate-limit it to blunt floods.
    # Requires this in the http{} block of the main nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=track:10m rate=10r/s;
    location = /api/track {
        limit_req zone=track burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main site traffic to Next.js
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Admin UI behind basic auth
    location /admin {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-clientsite;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Admin API behind basic auth
    location /api/admin {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-clientsite;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
